extends: default
rules:
  line-length:
    max: 200
    level: warning
  # GitHub Actions uses `on:` as a key; yamllint would flag it as a truthy value.
  truthy:
    allowed-values: ['true', 'false', 'on']
    check-keys: false
  document-start: disable
  comments:
    min-spaces-from-content: 1
  comments-indentation: disable
