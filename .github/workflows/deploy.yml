name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Never run two deploys at once. Later runs queue instead of cancelling an
# in-flight deploy, so a half-finished deploy is never interrupted.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Deploy via SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # Add your app's real secrets here, e.g.:
          # DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # JWT_SECRET: ${{ secrets.JWT_SECRET }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: GITHUB_TOKEN
          script: |
            set -e

            APP_DIR="/opt/your-app"
            REPO_URL="https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"

            # Install Docker if missing
            if ! command -v docker &>/dev/null; then
              curl -fsSL https://get.docker.com | sh
              systemctl enable --now docker
            fi

            docker network inspect proxy &>/dev/null || docker network create proxy

            # Clone or pull repo (Actions token auth works for private repos too)
            if [ -d "$APP_DIR/.git" ]; then
              git -C "$APP_DIR" remote set-url origin "$REPO_URL"
              git -C "$APP_DIR" pull origin main
            else
              git clone "$REPO_URL" "$APP_DIR"
            fi

            # Write .env on first deploy only — never overwrite, so manual
            # edits on the server survive future deploys.
            if [ ! -f "$APP_DIR/.env" ]; then
              cat > "$APP_DIR/.env" <<EOF
            NODE_ENV=production
            # Add your app's real config/secrets here
            EOF
            fi

            COMPOSE="docker compose -f $APP_DIR/docker-compose.yml --env-file $APP_DIR/.env"

            # Build first — for apps using Prisma or similar, this is also
            # where a schema-generation step (no real DB connection needed)
            # would run.
            $COMPOSE build

            # Apply pending DB migrations against production BEFORE the new
            # code (which may depend on the new schema) goes live. Adjust
            # or remove this line for apps with no migrations.
            $COMPOSE run --rm -T app npm run db:migrate:deploy

            $COMPOSE up -d
            docker image prune -f

      - name: Notify on failure
        if: failure()
        run: |
          if [ -n "${{ vars.NOTIFY_WEBHOOK_URL }}" ]; then
            curl -s -X POST "${{ vars.NOTIFY_WEBHOOK_URL }}" \
              -H 'Content-Type: application/json' \
              -d "{\"text\": \"Deploy failed: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"
          fi
